name: Upload to Cloud Storage

on:
  workflow_dispatch:
    inputs:
      trace_id:
        description: 'trace_id'
        required: true
        type: string
      url:
        description: '要下载的文件 URL'
        required: true
        type: string
        default: ''
      local_file:
        description: '保存的文件名'
        required: false
        type: string
        default: ''
      channel:
        description: '上传渠道：0=夸克网盘（默认），1=百度网盘，2=移动云盘'
        required: false
        type: choice
        options:
          - '0'
          - '1'
          - '2'
        default: '0'
      cookie:
        description: '临时覆盖 Cookie（默认使用仓库变量/密钥）'
        required: false
        type: string
        default: ''
      token:
        description: '临时覆盖 Token（默认使用仓库变量/密钥）'
        required: false
        type: string
        default: ''
      pdir_fid:
        description: '目标父目录 ID（默认使用仓库变量/密钥）'
        required: false
        type: string
        default: ''
      remote_dir:
        description: '目标网盘目录'
        required: false
        type: string
        default: ''
      diagnostic_only:
        description: '仅运行百度下载速度诊断'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

run-name: >-
  [${{ 
    github.event.inputs.channel == '0' && 'quark' ||
    github.event.inputs.channel == '1' && 'baidu' ||
    github.event.inputs.channel == '2' && 'cmcc' ||
    'unknown'
  }}] ${{ github.event.inputs.local_file || 'upload' }} (${{ github.event.inputs.trace_id }})

jobs:
  upload:
    name: >-
      [${{ 
        github.event.inputs.channel == '0' && 'quark' ||
        github.event.inputs.channel == '1' && 'baidu' ||
        github.event.inputs.channel == '2' && 'cmcc' ||
        'unknown'
      }}] ${{ github.event.inputs.local_file || 'upload' }} (${{ github.event.inputs.trace_id }})
    runs-on: ubuntu-latest
    environment: prod

    steps:

      - name: 01-Workflow start
        run: |
          echo "WORKFLOW_START=$(date +%s)" >> $GITHUB_ENV
          echo "## ⏱ Workflow Timing Summary" >> $GITHUB_STEP_SUMMARY

      - name: 05-Show External IP
        run: |
          STEP_START=$(date +%s)
          echo "▶️ START Show External IP"

          echo "External IP:"
          curl -s ipinfo.io/ip
          echo ""

          if [ "${{ inputs.channel }}" = "1" ]; then
            echo "Checking Baidu PCS connectivity..."
            if curl -sS --connect-timeout 10 --max-time 15 \
              https://d.pcs.baidu.com > /dev/null; then
              echo "✅ Baidu Domain reachable"
            else
              echo "⚠️ Baidu connectivity precheck timed out; continuing to real upload."
              echo "Upload result will be validated by result.json."
            fi
          fi

          STEP_END=$(date +%s)
          COST=$((STEP_END-STEP_START))
          echo "⏱ Show External IP cost: ${COST}s"
          echo "- Show External IP: ${COST}s" >> $GITHUB_STEP_SUMMARY

      - name: 10-Show disk space
        run: |
          STEP_START=$(date +%s)
          echo "▶️ START Show disk space"

          df -h /

          STEP_END=$(date +%s)
          COST=$((STEP_END-STEP_START))
          echo "⏱ Show disk space cost: ${COST}s"
          echo "- Show disk space: ${COST}s" >> $GITHUB_STEP_SUMMARY

      - name: 20-Checkout downloader source for diagnostic
        if: inputs.diagnostic_only == 'true'
        uses: actions/checkout@v4
        with:
          repository: xuhongming251/save_network_disk
          ref: v1.0.5
          path: diagnostic-source
          token: ${{ secrets.GH_PAT }}

      - name: 25-Baidu download speed diagnostic
        if: inputs.diagnostic_only == 'true'
        env:
          COOKIE_BAIDU: ${{ vars.COOKIE_BAIDU || secrets.COOKIE_BAIDU || '' }}
        run: |
          python3 -m pip install --disable-pip-version-check --quiet requests
          python3 -u - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import time
          from urllib.parse import urlparse

          sys.path.insert(0, str(pathlib.Path("diagnostic-source").resolve()))
          from baidu.baidu_pcs import BaiduPCS

          cookie = os.environ.get("COOKIE_BAIDU", "").strip()
          if not cookie:
              raise SystemExit("COOKIE_BAIDU is not configured")

          client = BaiduPCS()
          client.set_auth(cookie_str=cookie)

          membership = {"is_vip": None, "vip_type": None, "is_svip": None}
          response = client.session.get(
              "https://pan.baidu.com/api/gettemplatevariable",
              params={"fields": '["is_vip","vip_type","is_svip"]'},
              timeout=(15, 30),
          )
          response.raise_for_status()
          payload = response.json()
          if payload.get("errno") != 0:
              raise SystemExit(f"Baidu membership check failed: errno={payload.get('errno')}")
          membership.update({key: payload.get("result", {}).get(key) for key in membership})
          print("Membership flags:", json.dumps(membership, ensure_ascii=False))

          remote_path = (
              "/share/baidu_download_20260802_035711_e02730/Screen Studio/"
              "Screen Studio 3.1.1-3414 M系列芯片.dmg"
          )
          expected_size = 213_304_918
          probe = client.session.get(
              "https://d.pcs.baidu.com/rest/2.0/pcs/file",
              params={"method": "download", "path": remote_path, "app_id": "250528"},
              headers={"User-Agent": "pan.baidu.com", "Range": "bytes=0-0"},
              stream=True,
              allow_redirects=True,
              timeout=(15, 90),
          )
          probe_info = {
              "status_code": probe.status_code,
              "final_host": urlparse(probe.url).hostname,
              "content_range": probe.headers.get("content-range", ""),
              "accept_ranges": probe.headers.get("accept-ranges", ""),
          }
          probe.close()
          print("Range probe:", json.dumps(probe_info, ensure_ascii=False))

          results = []
          root = pathlib.Path("diagnostic-downloads")
          root.mkdir(exist_ok=True)
          for workers in (1, 4, 8):
              destination = root / f"workers-{workers}"
              destination.mkdir(exist_ok=True)
              started = time.monotonic()
              result = client.download(
                  remote_path,
                  local_path=str(destination),
                  parallel=workers,
                  filename="sample.dmg",
                  expected_size=expected_size,
              )
              elapsed = time.monotonic() - started
              actual_size = int(result.get("size") or 0)
              row = {
                  "workers": workers,
                  "status": result.get("status"),
                  "elapsed_seconds": round(elapsed, 3),
                  "bytes": actual_size,
                  "mb_per_second": round(actual_size / elapsed / 1_000_000, 3) if elapsed else 0,
                  "mib_per_second": round(actual_size / elapsed / 1024 / 1024, 3) if elapsed else 0,
                  "message": result.get("message", ""),
              }
              print("A/B result:", json.dumps(row, ensure_ascii=False))
              results.append(row)

          report = {
              "membership": membership,
              "probe": probe_info,
              "remote_path": remote_path,
              "expected_size": expected_size,
              "results": results,
          }
          pathlib.Path("baidu-speed-diagnostic.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          if any(row["status"] != "success" or row["bytes"] != expected_size for row in results):
              raise SystemExit("One or more diagnostic downloads failed validation")
          PY

      - name: 27-Upload Baidu speed diagnostic
        if: always() && inputs.diagnostic_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: baidu-speed-diagnostic
          path: baidu-speed-diagnostic.json

      # - name: 20-Checkout code
      #   uses: actions/checkout@v4
        
      # - name: 25-Install dependencies
      #   run: |
      #     STEP_START=$(date +%s)
      #     echo "▶️ START Install dependencies"

      #     python -m pip install --upgrade pip
      #     pip install -r requirements.txt --no-cache-dir

      #     echo "After Install Deps:"
      #     df -h /

      #     STEP_END=$(date +%s)
      #     COST=$((STEP_END-STEP_START))
      #     echo "⏱ Install dependencies cost: ${COST}s"
      #     echo "- Install dependencies: ${COST}s" >> $GITHUB_STEP_SUMMARY

      - name: 30-Download binaries
        if: inputs.diagnostic_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          STEP_START=$(date +%s)
          echo "▶️ START Download binaries"

          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Error: GH_TOKEN is not set. Please add it to your repository secrets."
            exit 1
          fi

          gh release download v1.0.5 \
            --repo xuhongming251/save_network_disk \
            --pattern "baidu-cli" \
            --pattern "save-network-disk"

          chmod +x ./save-network-disk
          chmod +x ./baidu-cli

          echo "Files after download:"
          ls -R

          STEP_END=$(date +%s)
          COST=$((STEP_END-STEP_START))
          echo "⏱ Download binaries cost: ${COST}s"
          echo "- Download binaries: ${COST}s" >> $GITHUB_STEP_SUMMARY
          

      - name: 40-Set permissions
        if: inputs.diagnostic_only != 'true'
        run: |
          STEP_START=$(date +%s)
          echo "▶️ START Set permissions"

          chmod +x save-network-disk
          if [ -f baidu-cli ]; then
            chmod +x baidu-cli
          fi

          STEP_END=$(date +%s)
          COST=$((STEP_END-STEP_START))
          echo "⏱ Set permissions cost: ${COST}s"
          echo "- Set permissions: ${COST}s" >> $GITHUB_STEP_SUMMARY

      - name: 60-Download file
        if: inputs.diagnostic_only != 'true'
        id: download
        env:
          COOKIE_BAIDU: ${{ vars.COOKIE_BAIDU || secrets.COOKIE_BAIDU || '' }}
        run: |
          STEP_START=$(date +%s)
          echo "▶️ START Download"
          
          echo "Files before execution:"
          ls -lh

          ./save-network-disk \
            --url "${{ inputs.url }}" \
            --local-file "${{ inputs.local_file }}" \
            --only-download

          STEP_END=$(date +%s)
          COST=$((STEP_END-STEP_START))
          echo "⏱ Download cost: ${COST}s"
          echo "- Download file: ${COST}s" >> $GITHUB_STEP_SUMMARY

      - name: 88-Upload to cloud
        if: inputs.diagnostic_only != 'true'
        id: upload
        env:
          COOKIE: ${{ vars.COOKIE || secrets.COOKIE || '' }}
          COOKIE_BAIDU: ${{ vars.COOKIE_BAIDU || secrets.COOKIE_BAIDU || '' }}
          TOKEN: ${{ vars.TOKEN || secrets.TOKEN || '' }}
          PDIR_FID: ${{ vars.PDIR_FID || secrets.PDIR_FID || '' }}
        run: |
          STEP_START=$(date +%s)
          echo "▶️ START Upload"

          if [ "${{ inputs.channel }}" = "1" ]; then
            SELECTED_COOKIE="${COOKIE_BAIDU}"
          elif [ "${{ inputs.channel }}" = "2" ]; then
            SELECTED_TOKEN="${TOKEN}"
          else
            SELECTED_COOKIE="${COOKIE}"
          fi

          [ -n "${{ inputs.cookie }}" ] && FINAL_COOKIE="${{ inputs.cookie }}" || FINAL_COOKIE="${SELECTED_COOKIE}"
          [ -n "${{ inputs.token }}" ] && FINAL_TOKEN="${{ inputs.token }}" || FINAL_TOKEN="${SELECTED_TOKEN}"

          ./save-network-disk \
            --cookie "${FINAL_COOKIE}" \
            --token "${FINAL_TOKEN}" \
            --url "${{ inputs.url }}" \
            --local-file "${{ steps.download.outputs.download_path || inputs.local_file }}" \
            --pdir-fid "${{ inputs.pdir_fid != '' && inputs.pdir_fid || env.PDIR_FID || '' }}" \
            --remote-dir "${{ inputs.remote_dir }}" \
            --channel "${{ inputs.channel }}" \
            --trace-id "${{ inputs.trace_id }}" \
            --no-download

          STEP_END=$(date +%s)
          COST=$((STEP_END-STEP_START))
          echo "⏱ Upload cost: ${COST}s"
          echo "- Upload to cloud: ${COST}s" >> $GITHUB_STEP_SUMMARY

      - name: 95-Upload result
        if: always() && inputs.diagnostic_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json

      - name: 98-Validate result.json
        if: inputs.diagnostic_only != 'true'
        run: |
          if [ ! -f result.json ]; then
            echo "❌ result.json not found"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import pathlib
          import sys

          result_path = pathlib.Path("result.json")
          try:
              data = json.loads(result_path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"❌ Invalid result.json: {exc}")
              print(result_path.read_text(encoding="utf-8", errors="replace"))
              sys.exit(1)

          status = data.get("status", "unknown")
          if status != "success":
              print(f"❌ Failed with status={status}")
              print(json.dumps(data, ensure_ascii=False, indent=2))
              sys.exit(1)
          PY

      - name: 100-Print total workflow time
        if: always()
        run: |
          WORKFLOW_END=$(date +%s)
          TOTAL=$((WORKFLOW_END-WORKFLOW_START))

          echo "🔥 TOTAL WORKFLOW TIME: ${TOTAL}s"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔥 Total: ${TOTAL}s" >> $GITHUB_STEP_SUMMARY
